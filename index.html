<form action="https://api.web3forms.com/submit" method="POST" class="contact-container">
    <!-- Ta clé d'accès Web3Forms -->
    <input type="hidden" name="apikey" value="ddd7891a-0d2a-41d2-ae52-8e58f1dbac12">
    
    <div class="form-group">
        <label>Nom complet</label>
        <input type="text" name="nom" required placeholder="Ex: Kouadio Jean">
    </div>
    <div class="form-group">
        <label>Téléphone / WhatsApp</label>
        <input type="tel" name="telephone" required placeholder="Ex: +225 07 00 00 00 00">
    </div>
    <div class="form-group">
        <label>Profil</label>
        <select name="profil" required>
            <option value="">Sélectionner votre profil</option>
            <option value="Jeune Joueur / Parent">Jeune Joueur / Parent</option>
            <option value="Membre / Cotisant">Membre / Cotisant</option>
            <option value="Partenaire / Sponsor">Partenaire / Sponsor</option>
        </select>
    </div>
    <div class="form-group">
        <label>Message</label>
        <textarea name="message" rows="4" placeholder="Votre message pour le bureau de l'EFAM FC..."></textarea>
    </div>

    <!-- Redirection après l'envoi vers le site -->
    <input type="hidden" name="redirect" value="https://efamfc.vercel.app">

    <button type="submit" class="btn btn-gold btn-full">Envoyer le message</button>
</form>
